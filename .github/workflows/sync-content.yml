name: Sync upstream content

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Sync content from Microsoft/RustTraining
        run: |
          chmod +x scripts/sync-content.sh
          bash scripts/sync-content.sh

      - name: Sync 100 Rust Projects (emmaglorypraise/100rustprojects)
        run: |
          chmod +x scripts/sync-100-rust-projects.sh
          bash scripts/sync-100-rust-projects.sh
          node scripts/build-100-projects-manifest.js

      - name: Check for changes
        id: check
        run: |
          if [ -z "$(git status --porcelain -- content/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update changelog
        if: steps.check.outputs.changed == 'true'
        run: node scripts/update-changelog.js

      - name: Setup pnpm
        if: steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        if: steps.check.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Type-checks book code blocks with rustc to rebuild data/rust-blocks.json and data/quizzes.json; nothing is executed.
      - name: Regenerate run and quiz data
        if: steps.check.outputs.changed == 'true'
        run: pnpm gen:rust-data

      - name: Check exercises
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: pnpm check:exercises

      - name: Bump patch version & generate content hash
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          node scripts/generate-content-hash.js
          node scripts/sync-sw-version.js

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: chore/sync-upstream-content
          delete-branch: true
          commit-message: "chore: sync upstream book content"
          title: "chore: sync upstream book content"
          body: |
            Automated content sync from:
            - [microsoft/RustTraining](https://github.com/microsoft/RustTraining) (`src/` markdown)
            - [emmaglorypraise/100rustprojects](https://github.com/emmaglorypraise/100rustprojects) (notes + progress manifest)

            Also, when `content/` changes:
            - adds today's entry to `data/changelog.json` (shown on /changes and in /rss.xml)
            - regenerates the runnable-code and quiz data (`data/rust-blocks.json`, `data/quizzes.json`) with rustc; check the "Check exercises" step log for exercise warnings
            - bumps the patch version and regenerates the content hash & service worker cache name

            Review the diff and merge when ready.
          labels: |
            content
            automated
